name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/luke_roberts/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match manifest version $manifest"
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
