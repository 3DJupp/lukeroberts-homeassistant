immediate_light:
  target:
    entity:
      integration: luke_roberts
      domain: light
  fields:
    uplight_hs_color:
      example: "[30, 80]"
      selector:
        object:
    uplight_kelvin:
      selector:
        color_temp:
          unit: kelvin
          min: 2700
          max: 4000
    uplight_brightness:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    downlight_kelvin:
      selector:
        color_temp:
          unit: kelvin
          min: 2700
          max: 4000
    downlight_brightness:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    duration:
      default:
        seconds: 0
      selector:
        duration:

save_scene:
  target:
    entity:
      integration: luke_roberts
      domain: light
  fields:
    name:
      required: true
      example: "Abendessen"
      selector:
        text:
    scene:
      example: "Lesen"
      selector:
        text:
    uplight_hs_color:
      example: "[30, 80]"
      selector:
        object:
    uplight_kelvin:
      selector:
        color_temp:
          unit: kelvin
          min: 2700
          max: 4000
    uplight_brightness:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    downlight_kelvin:
      selector:
        color_temp:
          unit: kelvin
          min: 2700
          max: 4000
    downlight_brightness:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    activate:
      default: false
      selector:
        boolean:

delete_scene:
  target:
    entity:
      integration: luke_roberts
      domain: light
  fields:
    scene:
      required: true
      example: "Abendessen"
      selector:
        text:
